name: Daily Refresh

on:
  schedule:
    - cron: '0 5 * * *'  # 5:00 UTC daily
  workflow_dispatch:  # lets you trigger it manually from GitHub's Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh FX rates
        run: python src/exchange_rates.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Refresh customer spend
        run: python src/customer_spend.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Refresh country breakdown
        run: python src/country_breakdown.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}